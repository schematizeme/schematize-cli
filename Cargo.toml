[package]
name = "schematize"
version = "0.22.0"
edition = "2021"
description = "Gerenciador do ecossistema schematize: instala/versiona as skills e roda o modo overdev (dev contínuo à prova de parada). Linux-first."
license = "MIT"

[lib]
name = "schematize"
path = "src/lib.rs"

[[bin]]
name = "schematize"
path = "src/main.rs"

# GUI (janela egui) — só compila com --features gui (precisa de libs X11/Wayland/GL).
[[bin]]
name = "schematize-gui"
path = "src/bin/schematize-gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"
# Backend glow (OpenGL), NÃO wgpu: o wgpu-hal (DX12) não compila no Windows com a
# versão atual do crate `windows`. glow compila limpo em Linux/macOS/Windows.
eframe = { version = "0.36.1", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
# Seletor de pasta NATIVO do sistema (só na GUI). Backend padrão = xdg-portal +
# wayland + pollster (blocking): funciona em Wayland/X11 via portal, SEM puxar GTK.
rfd = { version = "0.17", optional = true, default-features = false, features = [
    "xdg-portal",
    "wayland",
] }
portable-pty = "0.9.0"

[profile.release]
strip = true
opt-level = "z"
lto = true

[features]
gui = ["dep:eframe", "dep:rfd"]

# ---- Empacotamento .deb (Debian/Mint/Ubuntu) — cargo-deb ----
[package.metadata.deb]
maintainer = "schematize <tech@volucer.me>"
copyright = "2026, schematize"
license-file = ["LICENSE", "0"]
extended-description = "Instala e versiona as skills do catálogo schematize e roda o modo overdev (dev contínuo à prova de parada). Um agente opcional inicia com a sessão, checa atualizações e notifica com opção de atualizar."
section = "utils"
priority = "optional"
# A GUI (winit/wgpu) carrega as libs de janela por dlopen em runtime — o ELF só
# linka libc, então o $auto (dpkg-shlibdeps) não as enxerga. Declaradas à mão pra
# o apt garantir tudo mesmo num sistema enxuto (num desktop KDE/Cinnamon já há).
# curl/unzip/git são do CLI (baixar skills). GUI vai pré-compilada — sem libs -dev.
depends = "$auto, curl, unzip, git, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/schematize", "usr/bin/", "755"],
    ["target/release/schematize-gui", "usr/bin/", "755"],
    ["packaging/schematize-agent.desktop", "etc/xdg/autostart/schematize-agent.desktop", "644"],
    ["packaging/schematize-gui.desktop", "usr/share/applications/schematize-gui.desktop", "644"],
    ["packaging/schematize.png", "usr/share/icons/hicolor/256x256/apps/schematize.png", "644"],
    ["README.md", "usr/share/doc/schematize/README.md", "644"],
]

# ---- Empacotamento .rpm (openSUSE Leap / Fedora) — cargo-generate-rpm ----
[package.metadata.generate-rpm]
summary = "Gerenciador do ecossistema schematize (skills + overdev), Linux-first."
license = "MIT"
# builtin = analisa o ELF e gera os Requires de soname (libX11.so.6()(64bit)…)
# sem depender do rpm no host de build; o zypper resolve pro pacote da distro.
auto-req = "builtin"
assets = [
    { source = "target/release/schematize", dest = "/usr/bin/schematize", mode = "755" },
    { source = "target/release/schematize-gui", dest = "/usr/bin/schematize-gui", mode = "755" },
    { source = "packaging/schematize-agent.desktop", dest = "/etc/xdg/autostart/schematize-agent.desktop", mode = "644" },
    { source = "packaging/schematize-gui.desktop", dest = "/usr/share/applications/schematize-gui.desktop", mode = "644" },
    { source = "packaging/schematize.png", dest = "/usr/share/icons/hicolor/256x256/apps/schematize.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/schematize/README.md", mode = "644" },
]

[package.metadata.generate-rpm.requires]
curl = "*"
unzip = "*"
git = "*"
# libs da GUI (dlopen em runtime) — via capabilities de soname, que openSUSE/Fedora
# proveem independente do nome do pacote. O zypper resolve pro pacote certo.
"libX11.so.6()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
