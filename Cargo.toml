[package]
name = "schematize"
version = "0.55.5"
edition = "2021"
description = "Gerenciador do ecossistema schematize: instala/versiona as skills e roda o modo overdev (dev contínuo à prova de parada). Linux-first."
license = "MIT"

[lib]
name = "schematize"
path = "src/lib.rs"

[[bin]]
name = "schematize"
path = "src/main.rs"

# O binário `schematize-gui` NÃO é produzido aqui. Ele é a GUI Slint, que mora no
# repo schematizeme/schematize_gui_slint — o CI o compila de lá e empacota junto
# (ver .github/workflows/release.yml). A GUI egui que existia neste crate foi
# REMOVIDA: era só um fallback, e era ela que os .deb/.rpm e os binários publicados
# instalavam — daí o sintoma recorrente de "o lançador abre a versão antiga".
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"
# Encoder PNG — gera o ícone (appicon) em PNG A PARTIR DO CÓDIGO, pros hicolor/.desktop, sem depender
# de rasterizador externo (ImageMagick/rsvg) que falha em SVG. Já está no dep tree (transitivo).
png = "0.18"
portable-pty = "0.9.0"
# DB local do overdev (SQLite). Duas formas de obter a lib:
#
#  - `sqlite-embutido` (DEFAULT): compila o SQLite (~250 mil linhas de C) dentro do
#    binário. É o que os RELEASES publicados usam — binário que roda em qualquer
#    distro, sem depender da versão de libsqlite3 de quem baixou.
#  - `sqlite-do-sistema`: linka a libsqlite3 que já está instalada. Não compila C
#    nenhum, e é o certo pra quem constrói do FONTE na própria máquina. O
#    install.sh detecta (`pkg-config --exists sqlite3`) e escolhe sozinho.
#
# Crate de Rust não dá pra pegar da distro (Rust não tem ABI estável — os
# `librust-*-dev` só servem ao rustc da própria distro). Biblioteca C, dá — e é
# por isso que este é o único ponto onde reusar o pacote do sistema faz sentido.
rusqlite = { version = "0.31", default-features = false }

# Perfil de release COMPARTILHADO pelos repos do app (CLI, GUI Slint, updater-GUI).
#
# Por que idênticos: o install.sh compila os três com um `CARGO_TARGET_DIR` único.
# 226 das dependências são as MESMAS nos três — com o target compartilhado elas
# compilam UMA vez em vez de três. Mas cargo só reaproveita um artefato se o
# perfil bater EXATAMENTE; qualquer divergência aqui (um `opt-level` diferente que
# seja) parte o cache e a economia evapora. Então: mesmos valores nos três repos.
#
# `opt-level = 3` (não "z"): medido na GUI, otimizar pra tamanho custava ~6x de CPU
# no arranque (a tabela está no Cargo.toml dela). `lto = "thin"` liga menos que o
# fat e religa mais rápido a cada mudança, com o mesmo binário na prática.
[profile.release]
strip = true
opt-level = 3
lto = "thin"

[features]
default = ["sqlite-embutido"]
# Ver a nota em `rusqlite`, acima.
sqlite-embutido = ["rusqlite/bundled"]
sqlite-do-sistema = []

# ---- Empacotamento .deb (Debian/Mint/Ubuntu) — cargo-deb ----
[package.metadata.deb]
maintainer = "schematize <tech@volucer.me>"
copyright = "2026, schematize"
license-file = ["LICENSE", "0"]
extended-description = "Instala e versiona as skills do catálogo schematize e roda o modo overdev (dev contínuo à prova de parada). Um agente opcional inicia com a sessão, checa atualizações e notifica com opção de atualizar."
section = "utils"
priority = "optional"
# A GUI (winit/wgpu) carrega as libs de janela por dlopen em runtime — o ELF só
# linka libc, então o $auto (dpkg-shlibdeps) não as enxerga. Declaradas à mão pra
# o apt garantir tudo mesmo num sistema enxuto (num desktop KDE/Cinnamon já há).
# curl/unzip/git são do CLI (baixar skills). GUI vai pré-compilada — sem libs -dev.
depends = "$auto, curl, unzip, git, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/schematize", "usr/bin/", "755"],
    ["target/release/schematize-gui", "usr/bin/", "755"],
    ["packaging/schematize-agent.desktop", "etc/xdg/autostart/schematize-agent.desktop", "644"],
    ["packaging/schematize-gui.desktop", "usr/share/applications/schematize-gui.desktop", "644"],
    ["packaging/schematize.png", "usr/share/icons/hicolor/256x256/apps/schematize.png", "644"],
    ["README.md", "usr/share/doc/schematize/README.md", "644"],
]

# ---- Empacotamento .rpm (openSUSE Leap / Fedora) — cargo-generate-rpm ----
[package.metadata.generate-rpm]
summary = "Gerenciador do ecossistema schematize (skills + overdev), Linux-first."
license = "MIT"
# builtin = analisa o ELF e gera os Requires de soname (libX11.so.6()(64bit)…)
# sem depender do rpm no host de build; o zypper resolve pro pacote da distro.
auto-req = "builtin"
assets = [
    { source = "target/release/schematize", dest = "/usr/bin/schematize", mode = "755" },
    { source = "target/release/schematize-gui", dest = "/usr/bin/schematize-gui", mode = "755" },
    { source = "packaging/schematize-agent.desktop", dest = "/etc/xdg/autostart/schematize-agent.desktop", mode = "644" },
    { source = "packaging/schematize-gui.desktop", dest = "/usr/share/applications/schematize-gui.desktop", mode = "644" },
    { source = "packaging/schematize.png", dest = "/usr/share/icons/hicolor/256x256/apps/schematize.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/schematize/README.md", mode = "644" },
]

[package.metadata.generate-rpm.requires]
curl = "*"
unzip = "*"
git = "*"
# libs da GUI (dlopen em runtime) — via capabilities de soname, que openSUSE/Fedora
# proveem independente do nome do pacote. O zypper resolve pro pacote certo.
"libX11.so.6()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
