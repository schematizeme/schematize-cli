[package]
name = "schematize"
version = "0.2.0"
edition = "2021"
description = "Gerenciador do ecossistema schematize: instala/versiona as skills e roda o modo overdev (dev contínuo à prova de parada). Linux-first."
license = "MIT"

[[bin]]
name = "schematize"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"

[profile.release]
strip = true
opt-level = "z"
lto = true
