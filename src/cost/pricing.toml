# Haiku 5.5 tem DUAS faixas por tamanho de prompt; aqui vai a de prompts até 100 mil tokens
# (input 0.10 / output 0.50 / cache_read 0.01). Acima disso a página cobra 0.50 / 2.50 / 0.05:
# o custo de requisições longas fica SUBESTIMADO até a faixa ser modelada.
[modelos.claude-haiku-5-5]
input = 0.1
output = 0.5
cache_write_5m = 0.125
cache_write_1h = 0.2
cache_read = 0.01
vigente_desde = "2026-10-31"
fonte = "platform.claude.com/docs/en/about-claude/pricing"
confirmado = false
nota = "faixa até 100k tokens de prompt; acima disso o preço é maior (0.50/2.50/0.05)"

