# Preços de API da Anthropic, US$ por 1M de tokens. Embutido no binário como DEFAULT;
# sobrescreva em ~/.config/schematize/pricing.toml (usuário) ou <archive>/custos/pricing.toml
# (projeto). Cada modelo do override substitui a entrada inteira do embutido.
#
# Fonte: https://platform.claude.com/docs/en/about-claude/pricing (conferida em 2026-10-31).
# `confirmado = false`: o PREÇO consta na página, mas o ID do modelo no transcript é inferido do
# padrão de nomes (só `claude-opus-5-5` e `claude-sonnet-5-5` foram vistos em transcripts reais).
# `vigente_desde` = data da conferência (a página não publica a data de início de cada preço).
versao = "2026-10-31"

[modelos.claude-fable-5-1]
input = 10.0
output = 50.0
cache_write_5m = 12.5
cache_write_1h = 20.0
cache_read = 0.25
vigente_desde = "2026-10-31"
fonte = "platform.claude.com/docs/en/about-claude/pricing"
confirmado = false

