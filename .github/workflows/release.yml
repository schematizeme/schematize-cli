name: release

# Compila os DOIS binários (schematize + schematize-gui) com a feature `gui`,
# empacota .deb/.rpm com a GUI JÁ COMPILADA dentro e as deps de runtime
# resolvidas automaticamente, e anexa tudo no release da tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag pra publicar (ex: v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # libs de BUILD da GUI (headers/pkg-config) + dpkg-shlibdeps p/ o $auto do .deb
      - name: deps de build (GUI + empacotamento)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config dpkg-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: instala empacotadores
        run: |
          cargo install cargo-deb --locked || cargo install cargo-deb
          cargo install cargo-generate-rpm --locked || cargo install cargo-generate-rpm

      - name: build release (com GUI)
        run: cargo build --release --features gui --bins

      - name: empacota .deb (GUI incluída, deps via $auto)
        run: cargo deb --no-build

      - name: empacota .rpm (GUI incluída, Requires via ELF)
        run: cargo generate-rpm

      - name: renomeia p/ nomes estáveis
        run: |
          mkdir -p dist
          cp target/release/schematize            dist/schematize-linux-x86_64
          cp target/release/schematize-gui        dist/schematize-gui-linux-x86_64
          cp target/debian/*.deb                  dist/schematize_amd64.deb
          cp target/generate-rpm/*.rpm            dist/schematize.x86_64.rpm
          cp install.sh                           dist/install.sh
          ls -l dist

      - name: publica no release
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" \
            dist/schematize_amd64.deb \
            dist/schematize.x86_64.rpm \
            dist/schematize-linux-x86_64 \
            dist/schematize-gui-linux-x86_64 \
            dist/install.sh \
            --clobber
