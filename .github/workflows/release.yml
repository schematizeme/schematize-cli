name: release

# Compila schematize (este repo) + schematize-gui (repo PRÓPRIO, clonado abaixo) para
# Linux, macOS, Windows e FreeBSD (x86_64). A feature `gui` NÃO existe desde a v0.39.0 — a GUI é outro crate.
# Linux: .deb/.rpm com a GUI já embutida + binários. macOS: binários arm64 e x86_64.
# Windows: .exe do CLI e da GUI. Os NOMES dos assets batem com selfupdate.rs
# (schematize-<os>-<arch>[.exe]) para o auto-update funcionar em cada plataforma.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag pra publicar (ex: v0.8.0)"
        required: true

permissions:
  contents: write

jobs:
  # 0) PORTÃO: nenhum release sai se um app que o hub delega por hook (overdev) não for
  # instalável numa máquina limpa. Roda ANTES de criar o release e de compilar qualquer coisa;
  # só o caminho de release passa por aqui (o ci.yml não). Ver `scripts/release-delegados.py`.
  portao_delegados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apps delegados por hook são instaláveis numa máquina limpa
        run: |
          python3 scripts/release-delegados.py --autoteste
          python3 scripts/release-delegados.py

  # 1) Cria (ou reaproveita) o release primeiro, pra todos os jobs subirem assets nele.
  create_release:
    needs: portao_delegados
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: cria release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  # 2) Linux — .deb/.rpm (GUI incluída) + binários + install.sh.
  linux:
    needs: create_release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: deps de build (GUI + empacotamento)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config dpkg-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: instala empacotadores
        run: |
          cargo install cargo-deb --locked || cargo install cargo-deb
          cargo install cargo-generate-rpm --locked || cargo install cargo-generate-rpm
      - name: build release (CLI)
        run: cargo build --release --bins
      - name: GUI Slint (repo próprio) — a ÚNICA GUI
        # O binário `schematize-gui` é a GUI Slint, que vive em outro repo. Antes o CI
        # publicava aqui a GUI egui deste crate — por isso .deb/.rpm e binários
        # instalavam a janela ANTIGA enquanto o install.sh do fonte instalava a nova.
        # Compilamos a Slint e a colocamos em target/release/, que é de onde o
        # cargo-deb / cargo-generate-rpm leem (Cargo.toml não muda).
        #
        # AS DUAS METADES DO RELEASE SÃO PINADAS, e cada uma por um motivo diferente:
        #
        # 1. QUAL GUI — `packaging/gui-pin.txt`, versionado NESTE repo. Antes era
        #    `git clone --depth 1` sem `--branch`, que traz o HEAD do main da GUI: o
        #    release publicava o que estivesse lá naquele instante, e recompilar a mesma
        #    tag dava outro binário.
        #
        # 2. CONTRA QUAL CLI — `--precise ${{ github.sha }}`, o commit DESTA tag. Antes era
        #    `cargo update -p schematize` cru, que descarta o Cargo.lock commitado da GUI e
        #    re-resolve pro HEAD do main deste repo.
        #
        # Não dá pra trocar o item 2 por `--locked`: o Cargo.lock da GUI pina um commit
        # ANTERIOR do CLI, então o release sairia com o CLI da tag ao lado de uma GUI ligada
        # a um CLI mais velho — duas metades diferentes no mesmo release.
        #
        # Detalhe e histórico em `src/guipin.rs`.
        run: |
          set -euo pipefail
          PIN=$(cat packaging/gui-pin.txt)
          if [ -z "$PIN" ]; then
            echo "::error::packaging/gui-pin.txt vazio — sem ele o release não é reproduzível"
            exit 1
          fi
          git init /tmp/gui
          cd /tmp/gui
          git remote add origin https://github.com/schematizeme/schematize_gui_slint.git
          if ! git fetch --depth 1 origin "$PIN"; then
            echo "::error::o commit $PIN não existe em schematize_gui_slint (pin desatualizado?)"
            exit 1
          fi
          git checkout --detach FETCH_HEAD
          cargo update -p schematize --precise "$GITHUB_SHA"
          cargo build --release
          cp target/release/schematize-gui "$GITHUB_WORKSPACE/target/release/schematize-gui"
      - name: empacota .deb / .rpm
        run: |
          cargo deb --no-build
          cargo generate-rpm
      - name: renomeia p/ nomes estáveis
        run: |
          mkdir -p dist
          cp target/release/schematize     dist/schematize-linux-x86_64
          cp target/release/schematize-gui dist/schematize-gui-linux-x86_64
          cp target/debian/*.deb           dist/schematize_amd64.deb
          cp target/generate-rpm/*.rpm     dist/schematize.x86_64.rpm
          cp install.sh                    dist/install.sh
      - name: publica
        run: |
          gh release upload "$TAG" \
            dist/schematize_amd64.deb \
            dist/schematize.x86_64.rpm \
            dist/schematize-linux-x86_64 \
            dist/schematize-gui-linux-x86_64 \
            dist/install.sh \
            --clobber

  # 3) macOS — binários nativos (Apple Silicon e Intel). Sem libs extras (Metal é do sistema).
  macos:
    needs: create_release
    strategy:
      # SEM fail-fast: um alvo que falha NÃO cancela o irmão que ia dar certo.
      #
      # Aconteceu na `v0.65.1`: o upload do macOS x86_64 bateu num `error connecting to
      # api.github.com` — erro TRANSITÓRIO de rede, com o binário já compilado — e o GitHub
      # cancelou o job do arm64, que estava a caminho de publicar. Um release perdeu DOIS assets
      # por causa de um, e a retentativa teve de refazer os dois.
      #
      # Os irmãos (market, optimizer, deployer) já têm isto; aqui faltava.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon
            arch: arm64
            target: aarch64-apple-darwin
          # Intel: CROSS-COMPILADO no runner arm64. A imagem `macos-13` foi APOSENTADA pelo
          # GitHub — um job que a pede fica "queued" pra sempre e segura o release inteiro
          # (foi o que travou a v0.52.0 por horas com os outros três jobs já prontos).
          #
          # `macos-15` e nao `macos-14`: a 14 ja esta marcada DEPRECATED no
          # `actions/runner-images` (issue 13518) e vai pelo mesmo caminho da 13. Trocar antes
          # de a imagem sumir custa esta linha; trocar depois custa um release travado sem erro.
          - runner: macos-15
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: build release (CLI)
        run: cargo build --release --bins --target ${{ matrix.target }}
      - name: GUI Slint (repo próprio) — a ÚNICA GUI
        run: |
          set -euo pipefail
          # Mesmo pin do job `linux` — ver o comentário longo lá e `src/guipin.rs`.
          # Os tres jobs clonavam o HEAD do main da GUI em PARALELO: um push nela durante o
          # release fazia os binarios linux/macos/windows do MESMO release virem de commits
          # diferentes. O pin elimina isso por construcao.
          PIN=$(cat packaging/gui-pin.txt)
          [ -n "$PIN" ] || { echo "::error::packaging/gui-pin.txt vazio"; exit 1; }
          git init /tmp/gui
          cd /tmp/gui
          git remote add origin https://github.com/schematizeme/schematize_gui_slint.git
          git fetch --depth 1 origin "$PIN" || {
            echo "::error::commit $PIN nao existe em schematize_gui_slint"; exit 1; }
          git checkout --detach FETCH_HEAD
          cargo update -p schematize --precise "$GITHUB_SHA"
          cargo build --release --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/schematize-gui" \
             "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/schematize-gui"
      - name: empacota (binários + .app zipado)
        run: |
          mkdir -p dist
          B=target/${{ matrix.target }}/release
          cp "$B/schematize"     "dist/schematize-macos-${{ matrix.arch }}"
          cp "$B/schematize-gui" "dist/schematize-gui-macos-${{ matrix.arch }}"
          # .app double-clicável (não assinado — no 1º uso: botão direito → Abrir).
          APP="dist/schematize.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$B/schematize-gui" "$APP/Contents/MacOS/schematize"
          cp packaging/schematize.png "$APP/Contents/Resources/schematize.png"
          # gera .icns a partir do PNG (ferramentas nativas do runner).
          ICON=dist/schematize.iconset
          mkdir -p "$ICON"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s packaging/schematize.png --out "$ICON/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) packaging/schematize.png --out "$ICON/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICON" -o "$APP/Contents/Resources/schematize.icns" || true
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>schematize</string>
            <key>CFBundleDisplayName</key><string>schematize</string>
            <key>CFBundleIdentifier</key><string>me.schematize.app</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleExecutable</key><string>schematize</string>
            <key>CFBundleIconFile</key><string>schematize</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          ( cd dist && zip -qr "schematize-macos-${{ matrix.arch }}-app.zip" schematize.app )
          chmod +x "dist/schematize-macos-${{ matrix.arch }}" "dist/schematize-gui-macos-${{ matrix.arch }}"
      - name: publica
        run: |
          gh release upload "$TAG" \
            "dist/schematize-macos-${{ matrix.arch }}" \
            "dist/schematize-gui-macos-${{ matrix.arch }}" \
            "dist/schematize-macos-${{ matrix.arch }}-app.zip" \
            --clobber

  # 4) Windows — .exe do CLI e da GUI + zip (Direct3D é do sistema, sem libs extras).
  windows:
    needs: create_release
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: build release (CLI)
        run: cargo build --release --bins
      - name: GUI Slint (repo próprio) — a ÚNICA GUI
        shell: bash
        run: |
          set -euo pipefail
          # Mesmo pin do job `linux` — ver o comentário longo lá e `src/guipin.rs`.
          # Os tres jobs clonavam o HEAD do main da GUI em PARALELO: um push nela durante o
          # release fazia os binarios linux/macos/windows do MESMO release virem de commits
          # diferentes. O pin elimina isso por construcao.
          PIN=$(cat packaging/gui-pin.txt)
          [ -n "$PIN" ] || { echo "::error::packaging/gui-pin.txt vazio"; exit 1; }
          git init /tmp/gui
          cd /tmp/gui
          git remote add origin https://github.com/schematizeme/schematize_gui_slint.git
          git fetch --depth 1 origin "$PIN" || {
            echo "::error::commit $PIN nao existe em schematize_gui_slint"; exit 1; }
          git checkout --detach FETCH_HEAD
          cargo update -p schematize --precise "$GITHUB_SHA"
          cargo build --release
          cp target/release/schematize-gui.exe "$GITHUB_WORKSPACE/target/release/schematize-gui.exe"
      - name: empacota
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/schematize.exe     dist/schematize-windows-x86_64.exe
          Copy-Item target/release/schematize-gui.exe  dist/schematize-gui-windows-x86_64.exe
          Compress-Archive -Path dist/schematize-windows-x86_64.exe,dist/schematize-gui-windows-x86_64.exe -DestinationPath dist/schematize-windows-x86_64.zip -Force
      - name: publica
        shell: bash
        run: |
          gh release upload "$TAG" \
            dist/schematize-windows-x86_64.exe \
            dist/schematize-gui-windows-x86_64.exe \
            dist/schematize-windows-x86_64.zip \
            --clobber

  # 5) FreeBSD x86_64 — job PRÓPRIO: o runner não é FreeBSD. O CLI é CROSS-COMPILADO com `cross`
  # (imagem do alvo x86_64-unknown-freebsd) e depois EXECUTADO de verdade numa VM FreeBSD
  # (vmactions): compilar não prova que roda, e um asset que baixa com HTTP 200 e não executa só
  # falha na máquina de quem instalou. A JANELA (schematize-gui, do pin de `packaging/gui-pin.txt`)
  # compila NATIVAMENTE dentro da VM (Slint precisa das libs X11/GL do FreeBSD) e é BEST-EFFORT:
  # se não compilar, o release do CLI NÃO falha — o instalador segue sem janela.
  # Tudo PINADO: `cross` na versão exata, a VM por SHA de commit (tag v1.5.9), FreeBSD 14.2.
  # Independente dos outros jobs: FreeBSD falhar não cancela linux/macos/windows.
  freebsd:
    needs: create_release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - name: cross 0.2.5 (versão pinada)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cross" --version
      - name: build release (CLI, cross)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cross" build --release --bin schematize --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/schematize" dist/schematize-freebsd-x86_64
      # O binário TEM de executar num FreeBSD de verdade antes de ser publicado.
      - name: O asset executa? (VM FreeBSD)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.2"
          usesh: true
          copyback: false
          run: |
            set -eu
            uname -sr
            [ "$(uname -s)" = "FreeBSD" ]
            chmod +x ./dist/schematize-freebsd-x86_64
            out="$(./dist/schematize-freebsd-x86_64 --version)"
            echo "$out"
            case "$out" in
              schematize*) ;;
              *) echo "saída de --version inesperada: $out" >&2; exit 1 ;;
            esac
      - name: Janela do hub (opcional, VM FreeBSD)
        id: janela
        continue-on-error: true
        timeout-minutes: 90
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.2"
          usesh: true
          copyback: true
          envs: "GITHUB_SHA"
          prepare: |
            pkg install -y rust git pkgconf libX11 libXcursor libXrandr libXi \
              libxkbcommon wayland mesa-libs libxcb fontconfig dejavu
          run: |
            set -eu
            # Mesmo pin do job `linux` — ver o comentário longo lá e `src/guipin.rs`.
            PIN=$(cat packaging/gui-pin.txt)
            [ -n "$PIN" ] || { echo "packaging/gui-pin.txt vazio"; exit 1; }
            git init /tmp/gui
            cd /tmp/gui
            git remote add origin https://github.com/schematizeme/schematize_gui_slint.git
            git fetch --depth 1 origin "$PIN"
            git checkout --detach FETCH_HEAD
            cargo update -p schematize --precise "$GITHUB_SHA"
            CARGO_TARGET_DIR=/tmp/gui-target cargo build --release
            cd -
            mkdir -p dist
            cp /tmp/gui-target/release/schematize-gui dist/schematize-gui-freebsd-x86_64
            test -s dist/schematize-gui-freebsd-x86_64
      - name: publica
        run: |
          set -euo pipefail
          chmod +x dist/*
          # A janela entra só se o passo dela deu certo.
          ASSETS=(dist/schematize-freebsd-x86_64)
          if [ "${{ steps.janela.outcome }}" = "success" ] && [ -s dist/schematize-gui-freebsd-x86_64 ]; then
            ASSETS+=(dist/schematize-gui-freebsd-x86_64)
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

  # 6) E2E FreeBSD — o one-liner REAL, numa VM limpa, DEPOIS de os assets subirem. NÃO bloqueia a
  # publicação (nada depende deste job): se falhar, fica vermelho e visível, mas o asset já saiu.
  # A VM não tem bash nem sudo; o usuário é comum, com `doas ... permit nopass`. O instalador é
  # buscado no SHA da tag (SCHEMATIZE_INSTALL_REF), não na main — testa o que foi liberado.
  e2e-freebsd:
    needs: [freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: one-liner --completo numa VM FreeBSD limpa
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.2"
          usesh: true
          copyback: false
          envs: "GITHUB_SHA"
          prepare: |
            pkg install -y doas
            echo 'permit nopass tester' > /usr/local/etc/doas.conf
            pw useradd tester -m -s /bin/sh
          run: |
            set -eu
            ! command -v bash >/dev/null 2>&1   # o ponto do teste: sem bash de partida
            cat > /tmp/e2e.sh <<EOF
            set -u
            fetch -o - https://raw.githubusercontent.com/schematizeme/schematize-cli/$GITHUB_SHA/install.sh \
              | env SCHEMATIZE_INSTALL_REF=$GITHUB_SHA sh -s -- --completo
            echo "install rc=\$?"
            PATH="\$HOME/.cargo/bin:\$PATH"; export PATH
            h="\$(schematize --version)"; echo "\$h"
            m="\$(schematize-market --version)"; echo "\$m"
            case "\$h" in schematize\ *) ;; *) echo "hub: --version inesperado: \$h" >&2; exit 1 ;; esac
            case "\$m" in schematize-market*) ;; *) echo "market: --version inesperado: \$m" >&2; exit 1 ;; esac
            EOF
            chmod 644 /tmp/e2e.sh
            su tester -c 'sh /tmp/e2e.sh'
