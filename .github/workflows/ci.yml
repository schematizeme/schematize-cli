name: ci

# POR QUE ISTO EXISTE
#
# O repo tinha 431 testes e NENHUM workflow que os rodasse. O `release` só compila; o
# `version-guard` só confere o bump. Quer dizer: dava pra fundir código com a suíte
# vermelha e cortar um release em cima dela — ninguém saberia até o usuário saber.
#
# A Definition of Done da casa exige "CI verde". Sem este arquivo não existia CI que
# pudesse estar verde: a frase era verdadeira por vacuidade, que é a pior maneira de uma
# regra ser cumprida.
#
# O débito de formatação foi pago em 2026-08-31, numa passada dedicada, com um
# `rustfmt.toml` que faz o rustfmt concordar com o estilo da casa em vez do contrário.
# Dívida paga, o gate entra — formatação vira binária e ninguém discute vírgula em review.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rusqlite` liga no sqlite do SISTEMA por padrão (o `bundled` é feature opcional).
      - name: deps de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # O `--locked` PRECISA vir antes de qualquer outro comando cargo, e isso nao e estilo.
      #
      # Ele prova que o Cargo.lock COMMITADO resolve. Mas `clippy` e `test` reescrevem o lock
      # no disco ao rodar — entao, colocado depois deles, o guard mede um lock que os passos
      # anteriores acabaram de consertar. Foi o que aconteceu no deployer: verde no CI sobre um
      # lock defasado, e a falha so apareceu no RELEASE, que parte de checkout limpo — `cannot
      # update the lock file`, DEPOIS da tag cortada.
      #
      # Um guard cuja posicao no pipeline o desarma e pior que guard nenhum: ele da o verde.
      - name: o Cargo.lock commitado resolve (ANTES de qualquer cargo)
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      # Warning vira erro: `unwrap()` pra calar o compilador e erro engolido são pisos
      # da casa, e o clippy pega uma boa parte deles antes de virar review humano.
      # O shim roda como forced command no `authorized_keys` de servidor ALHEIO, sob o
      # `sh` que aquele host tiver — BusyBox ash, dash, mksh, o `sh` do FreeBSD. Nao da
      # pra executar todos; da pra exigir que o script seja POSIX de verdade, e isso um
      # analisador afirma melhor que qualquer quantidade de shells testados a mao.
      - name: fmt
        run: cargo fmt --check

      # UM comando so, o mesmo que o gate local roda (`scripts/verificar.sh`). Antes o CI
      # tinha a linha do shellcheck DUPLICADA aqui, e o script local cobria outro conjunto
      # de arquivos — duas verificacoes com o mesmo nome e escopos diferentes. Agora ha uma
      # fonte da verdade: a lista `ALVOS` dentro do script.
      - name: shellcheck (shim POSIX + install.sh bash)
        run: sh scripts/shellcheck-shim.sh

      # O analisador afirma que o script E POSIX; esta bateria afirma que ele SE COMPORTA
      # igual — recusa e aceita as mesmas coisas — em nove shells, incluindo o `posh`
      # (POSIX estrito, sem extensao nenhuma) e o `bash --posix`, que e o que o macOS
      # chama de /bin/sh.
      - name: shim se comporta igual em 9 shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash mksh ksh zsh busybox posh
          scripts/shim-portabilidade.sh sh dash bash mksh ksh zsh posh busybox_sh bash_posix

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: testes
        run: cargo test --all-targets

      # A suíte tem testes que leem o próprio fonte (conformidade código-vs-ADR, SQL
      # concatenado, doc-comment obrigatório). Rodar duas vezes não os torna mais fortes,
      # mas o `nextest`-menos-paralelo já expôs flake real aqui (a caixa do overdev
      # perdia pedido). Segunda passada barata contra regressão intermitente.
      - name: testes (segunda passada, caça a flaky)
        run: cargo test --all-targets --quiet

      # O PIN DA GUI EM DIA — o unico teste desta suite que precisa do repo IRMAO.
      #
      # `packaging/gui-pin.txt` decide qual commit da GUI o release publica. Ate aqui a suite
      # so provava que ele tem a FORMA certa (40 hex, uma linha): nada notava que ele estava
      # PARADO. Um pin que nunca e bumpado publica, release apos release, uma GUI de meses
      # atras — sem nenhum erro em lugar nenhum, porque o fetch funciona, o build funciona e o
      # asset sai. O sintoma chega como "atualizei e a janela continua igual".
      #
      # Os testes que atravessam fronteira de repo sao `#[ignore]` de proposito (um deles ja
      # quebrou o primeiro run verde desta esteira, por caminho relativo que so existia na
      # maquina de quem desenvolve). Este passo e o lugar onde eles rodam: o irmao e clonado
      # explicitamente, e so entao os `--ignored` sao chamados.
      #
      # `--depth 1` basta: o teste compara SHAs, nao percorre historico.
      - name: pin da GUI em dia
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/schematizeme/schematize_gui_slint.git \
            ../schematize_gui_slint
          cargo test --lib guipin -- --ignored

  # ---------------------------------------------------------------------------
  # O CODIGO COMPILA NO WINDOWS?
  #
  # POR QUE ISTO EXISTE: o `binary_runs` era `#[cfg(unix)]`, e quando o `ensure_gestor`
  # (ADR-0013) passou a chama-lo de codigo cross-platform, a definicao sumia no Windows e a
  # chamada ficava orfa. O codigo estava no `main`, verde, ha um dia — e so quebrou no job
  # `windows` do RELEASE, ou seja, DEPOIS da tag cortada, com o release publicado pela metade.
  #
  # A causa nao foi o `cfg`: foi o Windows so ser compilado em tag. Um alvo que so e
  # exercitado na publicacao e um alvo que descobre os proprios bugs na frente do usuario.
  #
  # POR QUE RUNNER WINDOWS, E NAO CROSS-COMPILE DO UBUNTU (que foi a 1a tentativa e falhou):
  # uma dependencia C compilada por `cc-rs` precisa do `lib.exe` da MSVC, que nao existe no
  # ubuntu — `error occurred in cc-rs: failed to find tool "lib.exe"`. Daria pra desviar pro
  # alvo `-gnu` com mingw, mais barato, e ele PEGARIA esta classe de bug (`cfg(windows)` vale
  # nos dois). Mas o release publica `-msvc`, e um guard que exercita um alvo diferente do que
  # se publica e um guard que mente sobre o que provou. Aqui o ambiente e o MESMO do release.
  #
  # `check` e nao `build`: a pergunta e "resolve e tipa", que e a classe inteira de erro que o
  # `cfg` produz. Linkar custaria minutos por push pra responder a mesma pergunta.
  # ---------------------------------------------------------------------------
  windows-compila:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (Windows)
        run: cargo check --all-targets
